name: Studio release

# Portable CPU packages of sd-server + sd-cli with the Studio Web UI built in.
# Runs only when started by hand (Actions tab -> Studio release -> Run workflow, pick the
# branch, usually master) and publishes them as a GitHub Release tagged studio-<date>-<commit>.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the packages as a GitHub Release (off = only build them, as workflow artifacts)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: studio-release-${{ github.ref }}
  cancel-in-progress: false

env:
  # One ggml CPU backend per instruction set (SSE4 ... AVX-512) is chosen at runtime.
  CPU_PORTABLE: -DGGML_NATIVE=OFF -DGGML_BACKEND_DL=ON -DGGML_CPU_ALL_VARIANTS=ON -DSD_BUILD_SHARED_LIBS=ON -DSD_BUILD_SHARED_GGML_LIB=ON -DSD_SERVER_BUILD_FRONTEND=ON

jobs:
  linux:
    # Built on 22.04 so the binaries run on glibc 2.35 and newer (Ubuntu 22.04+, Zorin OS 17+, Debian 12+).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Submodules
        run: git submodule update --init --depth 1 ggml thirdparty/libwebp thirdparty/libwebm

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - uses: pnpm/action-setup@v5
        with:
          version: 10.15.1

      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release $CPU_PORTABLE \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON -DCMAKE_INSTALL_RPATH='$ORIGIN'
          cmake --build build --target sd-server sd-cli

      - name: Package
        run: |
          pkg=sdcpp-studio-linux-x64
          mkdir -p "$pkg"
          cp -a build/bin/. "$pkg/"
          cp scripts/setup-sdcpp.sh "$pkg/"
          cp LICENSE "$pkg/stable-diffusion.cpp.txt"
          cp ggml/LICENSE "$pkg/ggml.txt"
          cp thirdparty/libwebm/LICENSE.TXT "$pkg/libwebm.txt"
          cp thirdparty/libwebp/COPYING "$pkg/libwebp.txt"
          git rev-parse --short HEAD > "$pkg/VERSION"
          echo "$pkg" > "$pkg/PACKAGE"
          "$pkg/sd-server" --version
          tar -czf "$pkg.tar.gz" "$pkg"

      - uses: actions/upload-artifact@v6
        with:
          name: sdcpp-studio-linux-x64
          path: sdcpp-studio-linux-x64.tar.gz

  linux-cuda:
    # NVIDIA GPUs. Built in the CUDA 12.8 image on Ubuntu 22.04 (glibc 2.35); the CUDA runtime and
    # cuBLAS are bundled, so the target machine only needs the NVIDIA driver (575 or newer).
    # Kernels for 7.5, 8.0, 9.0 and 12.0 cover Turing to Blackwell: 8.0 code also runs on 8.6
    # and 8.9 (A10, A40, L4, L40S, RTX 30/40), and 12.0 on later 12.x GPUs. ccache keeps
    # compiled kernels between runs, so only changed files are rebuilt.
    runs-on: ubuntu-22.04
    container: nvidia/cuda:12.8.1-devel-ubuntu22.04
    steps:
      - name: Tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git ca-certificates curl cmake ninja-build xz-utils ccache
          git config --global --add safe.directory '*'

      - uses: actions/checkout@v6

      - name: Submodules
        run: git submodule update --init --depth 1 ggml thirdparty/libwebp thirdparty/libwebm thirdparty/cutlass

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - uses: pnpm/action-setup@v5
        with:
          version: 10.15.1

      - name: Compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: cuda-ccache-${{ github.run_id }}
          restore-keys: cuda-ccache-

      - name: Build
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 3G
          CCACHE_COMPILERCHECK: content
        run: |
          ccache --zero-stats
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release $CPU_PORTABLE \
            -DSD_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES='75;80;90;120' \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_CUDA_COMPILER_LAUNCHER=ccache \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON -DCMAKE_INSTALL_RPATH='$ORIGIN'
          cmake --build build --target sd-server sd-cli -j "$(nproc)"
          ccache --show-stats

      - name: Package
        run: |
          pkg=sdcpp-studio-linux-x64-cuda
          mkdir -p "$pkg"
          cp -a build/bin/. "$pkg/"
          cp -a /usr/local/cuda/lib64/libcudart.so.12* /usr/local/cuda/lib64/libcublas.so.12* /usr/local/cuda/lib64/libcublasLt.so.12* "$pkg/"
          cp scripts/setup-sdcpp.sh "$pkg/"
          cp LICENSE "$pkg/stable-diffusion.cpp.txt"
          cp ggml/LICENSE "$pkg/ggml.txt"
          cp thirdparty/libwebm/LICENSE.TXT "$pkg/libwebm.txt"
          cp thirdparty/libwebp/COPYING "$pkg/libwebp.txt"
          cp thirdparty/cutlass/LICENSE.txt "$pkg/cutlass.txt"
          cp /usr/local/cuda/EULA.txt "$pkg/cuda-EULA.txt" 2>/dev/null || true
          git rev-parse --short HEAD > "$pkg/VERSION"
          echo "$pkg" > "$pkg/PACKAGE"
          # No GPU driver on the build machine: the toolkit's stub stands in for libcuda.so.1.
          mkdir -p /tmp/cuda-stub && ln -sf /usr/local/cuda/lib64/stubs/libcuda.so /tmp/cuda-stub/libcuda.so.1
          LD_LIBRARY_PATH=/tmp/cuda-stub "$pkg/sd-server" --version
          ldd "$pkg/libstable-diffusion.so" | grep -E 'cuda|cublas' || true
          tar -czf "$pkg.tar.gz" "$pkg"
          ls -lh "$pkg.tar.gz"

      - uses: actions/upload-artifact@v6
        with:
          name: sdcpp-studio-linux-x64-cuda
          path: sdcpp-studio-linux-x64-cuda.tar.gz

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6

      - name: Submodules
        run: git submodule update --init --depth 1 ggml thirdparty/libwebp thirdparty/libwebm

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - uses: pnpm/action-setup@v5
        with:
          version: 10.15.1

      - name: Build
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          & "$vsPath\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl.exe -DCMAKE_CXX_COMPILER=cl.exe -DCMAKE_CXX_FLAGS=/bigobj $env:CPU_PORTABLE.Split(' ')
          cmake --build build --target sd-server sd-cli

      - name: Package
        shell: pwsh
        run: |
          $pkg = "sdcpp-studio-windows-x64"
          New-Item -ItemType Directory $pkg | Out-Null
          Copy-Item build\bin\* $pkg -Recurse
          Copy-Item LICENSE "$pkg\stable-diffusion.cpp.txt"
          Copy-Item ggml\LICENSE "$pkg\ggml.txt"
          Copy-Item thirdparty\libwebm\LICENSE.TXT "$pkg\libwebm.txt"
          Copy-Item thirdparty\libwebp\COPYING "$pkg\libwebp.txt"
          git rev-parse --short HEAD | Set-Content "$pkg\VERSION"
          $launcher = @(
            '@echo off'
            'rem Starts Forevion Studio at http://127.0.0.1:1234. Close this window to stop it.'
            'rem The first start asks in the browser where models, inputs and outputs go (saved in studio-settings.json).'
            'cd /d "%~dp0"'
            'set /a THREADS=%NUMBER_OF_PROCESSORS% / 2'
            'start "" /min cmd /c "timeout /t 4 /nobreak >nul & start "" http://127.0.0.1:1234"'
            'sd-server.exe --listen-ip 127.0.0.1 --listen-port 1234 --settings-file studio-settings.json --mmap --auto-fit off --vae-tiling -t %THREADS%'
            'pause'
          )
          Set-Content "$pkg\start-studio.bat" $launcher -Encoding ascii
          & "$pkg\sd-server.exe" --version
          Compress-Archive -Path $pkg -DestinationPath "$pkg.zip"

      - uses: actions/upload-artifact@v6
        with:
          name: sdcpp-studio-windows-x64
          path: sdcpp-studio-windows-x64.zip

  release:
    if: ${{ inputs.publish }}
    needs: [linux, linux-cuda, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Checksums and tag
        id: meta
        run: |
          cd dist
          sha256sum sdcpp-studio-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          echo "tag=studio-$(date -u +%Y%m%d)-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Forevion Studio ${{ steps.meta.outputs.tag }}
          make_latest: true
          body: |
            Builds of sd-server and sd-cli with the Studio Web UI, from ${{ github.sha }}.

            - **Linux x64** (`sdcpp-studio-linux-x64.tar.gz`): glibc 2.35+ (Ubuntu 22.04+, Zorin OS 17+). Easiest: run `setup-sdcpp.sh` (also inside the archive), which downloads and starts this release.
            - **Linux x64 + NVIDIA GPU** (`sdcpp-studio-linux-x64-cuda.tar.gz`): CUDA 12.8 build for T4 / A100 / A10 / L4 / L40S / RTX 30-50 / H100 / RTX PRO 6000 class GPUs; needs the NVIDIA driver 575+. `setup-sdcpp.sh` picks it automatically when `nvidia-smi` finds a GPU.
            - **Windows x64** (`sdcpp-studio-windows-x64.zip`): unzip and double-click `start-studio.bat`.

            Models are downloaded from the Models page. Check files against `SHA256SUMS.txt`.
          files: |
            dist/sdcpp-studio-linux-x64.tar.gz
            dist/sdcpp-studio-linux-x64-cuda.tar.gz
            dist/sdcpp-studio-windows-x64.zip
            dist/SHA256SUMS.txt
